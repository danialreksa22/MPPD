<!DOCTYPE html>
<html lang="id">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Offline — MAGGURU RSUD Bulukumba</title>
  <style>
    * { box-sizing: border-box; margin: 0; padding: 0; font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif; }
    body {
      background: #f8fafc;
      color: #0f172a;
      display: flex;
      align-items: center;
      justify-content: center;
      min-height: 100vh;
      padding: 1.5rem;
      text-align: center;
    }
    .card {
      background: #ffffff;
      border: 1px solid #e2e8f0;
      border-radius: 1.25rem;
      padding: 2.5rem 1.75rem;
      max-width: 420px;
      width: 100%;
      box-shadow: 0 10px 25px -5px rgba(0, 0, 0, 0.05);
    }
    .icon-badge {
      width: 4rem;
      height: 4rem;
      background: #ecfdf5;
      border: 2px solid #a7f3d0;
      border-radius: 1rem;
      display: inline-flex;
      align-items: center;
      justify-content: center;
      margin-bottom: 1.25rem;
    }
    .icon-badge svg {
      width: 2rem;
      height: 2rem;
      color: #059669;
    }
    h1 {
      font-size: 1.25rem;
      font-weight: 800;
      color: #0f172a;
      margin-bottom: 0.5rem;
    }
    p {
      font-size: 0.875rem;
      color: #64748b;
      line-height: 1.5;
      margin-bottom: 1.5rem;
    }
    .btn {
      display: inline-block;
      width: 100%;
      padding: 0.75rem 1.25rem;
      background: #059669;
      color: #ffffff;
      font-size: 0.875rem;
      font-weight: 700;
      border-radius: 0.75rem;
      border: none;
      cursor: pointer;
      text-decoration: none;
      transition: background 0.2s;
    }
    .btn:hover { background: #047857; }
    .hospital-tag {
      margin-top: 1.25rem;
      font-size: 0.75rem;
      color: #94a3b8;
      font-weight: 600;
      letter-spacing: 0.05em;
      text-transform: uppercase;
    }
  </style>
</head>
<body>
  <div class="card">
    <div style="display: flex; justify-content: center; margin-bottom: 1.25rem;">
      <img src="/logo.png" alt="Logo RSUD Bulukumba" style="width: 72px; height: 72px; object-fit: contain;" />
    </div>
    <h1>Anda Sedang Offline</h1>
    <p>Koneksi internet di ruangan RSUD Bulukumba terputus. Pastikan perangkat Anda terhubung ke Wi-Fi RSUD atau data seluler untuk mengakses presensi dan jadwal dinas.</p>
    <button class="btn" onclick="window.location.reload()">Coba Muat Ulang</button>
    <div class="hospital-tag">RSUD H. Andi Sulthan Daeng Radja Bulukumba</div>
  </div>
</body>
</html>
